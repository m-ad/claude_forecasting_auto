name: tests

on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch cancels the previous still-running check for it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          # uv.lock is gitignored, so key the cache off the manifest instead.
          cache-dependency-glob: "pyproject.toml"

      - name: Sync dependencies (incl. dev group)
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q
