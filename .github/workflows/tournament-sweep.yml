name: tournament-sweep

# The competition path. Every 30 minutes a no-LLM gate asks Metaculus which open
# tournament questions the bot has not forecast yet. Each one gets its own job:
# scaffold from the API, one Claude Code session that researches and logs a
# forecast, then deterministic code submits it with its private comment and
# commits the record. No human is in the loop -- the bot tournaments require that.
#
# Opt-in: the schedule does nothing until the repository variable SWEEP_ENABLED is
# "true". A manual run (workflow_dispatch) always runs -- that is the smoke test.
#
# Why every 30 minutes: tournament questions open at random hours for 3 hours
# (FutureEval resources page, checked 2026-10-17). Worst case a question is seen
# ~30 min + scheduler delay after opening, leaving ~2 h for a ~25 min forecast.
# Each gate run bills one Actions minute while the repo is private (~1,440/month).

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      tournament:
        description: "Poll only this tournament slug (e.g. bot-testing-area). Blank = active registry entries."
        required: false
        default: ""
      post_ids:
        description: "Space-separated post ids to forecast (still open and not yet forecast by the bot)."
        required: false
        default: ""
      max_questions:
        description: "Cap on questions for this run."
        required: false
        default: ""
      mode:
        description: "Research mode: auto, deep or lean. Blank = the FORECAST_MODE variable (default auto)."
        required: false
        default: ""
      dry_run:
        description: "Forecast but do not submit, and commit nothing (smoke test of the model step)."
        type: boolean
        required: false
        default: false

# One sweep at a time: the next gate must see the previous sweep's submissions,
# or two jobs could forecast the same question.
concurrency:
  group: tournament-sweep
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  BOT_BRANCH: main
  PYTHON_VERSION: "3.13"

jobs:
  gate:
    if: vars.SWEEP_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_work: ${{ steps.poll.outputs.has_work }}
      questions: ${{ steps.poll.outputs.questions }}
      question_count: ${{ steps.poll.outputs.question_count }}
      reason: ${{ steps.poll.outputs.reason }}
      mode: ${{ steps.poll.outputs.mode }}
      exhausted_until: ${{ steps.poll.outputs.exhausted_until }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BOT_BRANCH }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Poll Metaculus
        id: poll
        env:
          METACULUS_API_KEY: ${{ secrets.METACULUS_API_KEY }}
          WEEKLY_BUDGET_USD_EQUIV: ${{ vars.WEEKLY_BUDGET_USD_EQUIV }}
          MAX_QUESTIONS_PER_RUN: ${{ inputs.max_questions || vars.MAX_QUESTIONS_PER_RUN || '6' }}
          # Read by scripts/allowance.py. Passed through unset: an empty value means the
          # defaults there, kept there only.
          FORECAST_MODE: ${{ vars.FORECAST_MODE }}
          ALLOWANCE_5H_USD_EQUIV: ${{ vars.ALLOWANCE_5H_USD_EQUIV }}
          ALLOWANCE_7D_USD_EQUIV: ${{ vars.ALLOWANCE_7D_USD_EQUIV }}
          ALLOWANCE_STOP_5H: ${{ vars.ALLOWANCE_STOP_5H }}
          ALLOWANCE_STOP_7D: ${{ vars.ALLOWANCE_STOP_7D }}
          LEAN_AT_5H: ${{ vars.LEAN_AT_5H }}
          LEAN_AT_7D: ${{ vars.LEAN_AT_7D }}
          # Passed through env, never interpolated into the script: dispatch input is free text.
          IN_TOURNAMENT: ${{ inputs.tournament }}
          IN_POST_IDS: ${{ inputs.post_ids }}
          IN_MODE: ${{ inputs.mode }}
        run: |
          args=(--github-output)
          if [ -n "$IN_MODE" ]; then
            [[ "$IN_MODE" =~ ^(auto|deep|lean)$ ]] || { echo "::error::mode must be auto, deep or lean"; exit 1; }
            args+=(--mode "$IN_MODE")
          fi
          if [ -n "$IN_TOURNAMENT" ]; then
            [[ "$IN_TOURNAMENT" =~ ^[a-z0-9-]+$ ]] || { echo "::error::bad tournament slug"; exit 1; }
            args+=(--tournament "$IN_TOURNAMENT")
          fi
          if [ -n "$IN_POST_IDS" ]; then
            [[ "$IN_POST_IDS" =~ ^[0-9\ ]+$ ]] || { echo "::error::post_ids must be numbers"; exit 1; }
            # shellcheck disable=SC2206  # word-splitting the id list is intended
            args+=(--post-ids $IN_POST_IDS)
          fi
          uv run --no-default-groups scripts/tournament_poll.py "${args[@]}"

  forecast:
    needs: gate
    if: needs.gate.outputs.has_work == 'true'
    name: forecast ${{ matrix.q.tournament }} ${{ matrix.q.post_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.MAX_PARALLEL || '3') }}
      matrix:
        q: ${{ fromJSON(needs.gate.outputs.questions) }}
    concurrency:
      group: question-${{ matrix.q.post_id }}
      cancel-in-progress: false
    env:
      POST_ID: ${{ matrix.q.post_id }}
      TOURNAMENT: ${{ matrix.q.tournament }}
      # The gate's research mode for this sweep (scripts/allowance.py): deep, or lean
      # when the Claude allowance is tight. Lean changes only the flags and env below.
      MODE: ${{ matrix.q.mode || 'deep' }}
      MODEL: ${{ (matrix.q.mode == 'lean' && vars.MODEL_LEAN) || vars.MODEL_FORECAST || 'opus' }}
      # The session's settings, at job level so the usage record's config snapshot
      # (record_usage.py --config) reads exactly what the session was given.
      EFFORT: ${{ matrix.q.mode == 'lean' && 'medium' || vars.EFFORT_FORECAST || 'high' }}
      MAX_USD: ${{ vars.MAX_USD_PER_QUESTION || '15' }}
      MINUTES: ${{ vars.MAX_MINUTES_PER_QUESTION || '25' }}
      # Read by the PreToolUse hook in settings.ci.json (scripts/search_budget.py),
      # which refuses WebSearch past these caps, and by log_forecast.py, which
      # waives the research floor once the session cap is used. Passed through
      # unset in deep mode: an empty value means the defaults in search_budget.py,
      # kept there only. Lean mode's numbers live here, next to its other knobs:
      # a 10-search cap and a floor of 6 (one per required category, plus one).
      MAX_WEB_SEARCHES: ${{ matrix.q.mode == 'lean' && '10' || vars.MAX_WEB_SEARCHES }}
      RESEARCH_MIN_SEARCHES: ${{ matrix.q.mode == 'lean' && '6' || '' }}
      MAX_WEB_SEARCHES_PER_SCOUT: ${{ vars.MAX_WEB_SEARCHES_PER_SCOUT }}
      # Unpinned by default: model aliases (`opus`, `sonnet`) resolve inside the CLI,
      # so a pinned CLI would stay on the models it knew. Pin via the variable if a
      # release breaks the sweep; the version used is in the Step Summary.
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BOT_BRANCH }}
          fetch-depth: 0
          # The forecaster session must not be able to read a push token from
          # .git/config; the commit step sets credentials only after it has exited.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies and Claude Code
        run: |
          uv sync
          npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          echo "Claude Code $(claude --version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Scaffold (or reuse) the question folder
        id: prep
        env:
          METACULUS_API_KEY: ${{ secrets.METACULUS_API_KEY }}
        run: |
          slug="$(uv run scripts/new_question.py --post-id "$POST_ID" \
            --tournament "$TOURNAMENT" --reuse | head -n1)"
          if [ -z "$slug" ] || [ ! -f "questions/$slug/meta.yaml" ]; then
            echo "::error::scaffold failed for post $POST_ID"
            exit 1
          fi
          version="$(uv run python -c "import sys,yaml; print((yaml.safe_load(open(sys.argv[1]))['current'] or {}).get('version') or 0)" "questions/$slug/meta.yaml")"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Question folder: \`questions/$slug\` (v$version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Forecast (Claude Code)
        id: claude
        if: steps.prep.outputs.version == '0'
        # Step-level timeout: when it fires, the job still runs the submit, usage
        # and commit steps below, so whatever was logged in time is not lost.
        timeout-minutes: ${{ fromJSON(vars.MAX_MINUTES_PER_QUESTION || '25') }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISABLE_AUTOUPDATER: "1"
          SLUG: ${{ steps.prep.outputs.slug }}
          SEARCH_BUDGET_FILE: ${{ runner.temp }}/search-budget.json
        run: |
          export FORECAST_DEADLINE="$(date -u -d "+${MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)"
          prompt="Forecast the bot-tournament question in questions/${SLUG}/. First read .claude/skills/tournament-forecast/SKILL.md and follow it exactly. The session is killed at ${FORECAST_DEADLINE} (UTC); log your forecast at least 5 minutes before that."
          # MAX_USD_PER_QUESTION=0 drops the per-session cap (e.g. if a CLI version
          # rejects it for subscription auth); the step timeout still applies.
          budget=()
          [ "$MAX_USD" != "0" ] && budget=(--max-budget-usd "$MAX_USD")
          # Lean: no research-scouts. Removing the spawn tool is a hard block that does
          # not rely on the prompt (Task is its old name).
          lean=()
          if [ "$MODE" = "lean" ]; then
            lean=(--disallowedTools Agent Task)
            prompt="$prompt Research mode: lean — follow SKILL.md § Lean mode."
          fi
          # The CLI warns that it ignores the allow list in .claude/settings.json because
          # the checkout is untrusted. Intended: that list is for interactive sessions and
          # is broader; this session must run on settings.ci.json alone. Never mark the
          # runner's checkout trusted (hasTrustDialogAccepted) to silence it.
          # stream-json, not json: research-scouts run in the background, which splits
          # the session into several turns, and json reports only the last one's cost
          # and denials. record_usage.py merges the per-turn result events.
          set +e
          claude -p "$prompt" \
            --model "$MODEL" \
            --effort "$EFFORT" \
            --output-format stream-json \
            --verbose \
            --permission-mode dontAsk \
            --settings .claude/settings.ci.json \
            "${lean[@]}" \
            "${budget[@]}" \
            > "$RUNNER_TEMP/claude.jsonl"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      # The session may run Python (Monte Carlo, distribution fits), which the
      # permission rules do not bind, and the steps below hold the Metaculus token
      # and a push credential. Undo every change outside the question folder and
      # the session's own ledger lines -- running the guard committed at HEAD with
      # the system interpreter -- then rebuild the virtualenv the next steps use.
      - name: Undo changes outside the question folder
        id: guard
        if: always() && steps.prep.outputs.slug != ''
        env:
          SLUG: ${{ steps.prep.outputs.slug }}
        run: |
          set -o pipefail
          git show HEAD:scripts/ci_guard.py | python3 -I - "$SLUG" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf .venv
          uv sync -q

      - name: Submit to Metaculus (forecast + private comment)
        id: submit
        if: always() && steps.guard.outcome == 'success'
        env:
          METACULUS_API_KEY: ${{ secrets.METACULUS_API_KEY }}
          SLUG: ${{ steps.prep.outputs.slug }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags=()
          [ "$DRY_RUN" = "true" ] && flags+=(--dry-run)
          set +e
          uv run scripts/submit_metaculus.py "$SLUG" "${flags[@]}" 2>&1 | tee "$RUNNER_TEMP/submit.log"
          status=${PIPESTATUS[0]}
          set -e
          { echo '### Submission'; echo '```'; cat "$RUNNER_TEMP/submit.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Record token usage
        if: always() && steps.claude.outcome != 'skipped' && steps.guard.outcome == 'success'
        env:
          SLUG: ${{ steps.prep.outputs.slug }}
          EXIT_CODE: ${{ steps.claude.outputs.exit_code }}
          # For the config snapshot (CONFIG_ENV in record_usage.py), next to the job's
          # session settings and GitHub's own GITHUB_* variables. Non-secret only.
          MAX_PARALLEL: ${{ vars.MAX_PARALLEL || '3' }}
          MAX_QUESTIONS_PER_RUN: ${{ inputs.max_questions || vars.MAX_QUESTIONS_PER_RUN || '6' }}
          WEEKLY_BUDGET_USD_EQUIV: ${{ vars.WEEKLY_BUDGET_USD_EQUIV }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          uv run scripts/record_usage.py record --result "$RUNNER_TEMP/claude.jsonl" \
            --job tournament-sweep --run-id "$GITHUB_RUN_ID" --slug "$SLUG" --model "$MODEL" \
            --search-budget "$RUNNER_TEMP/search-budget.json" --config \
            ${EXIT_CODE:+--exit-code "$EXIT_CODE"} --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the dry-run folder
        if: always() && inputs.dry_run && steps.prep.outputs.slug != ''
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ matrix.q.post_id }}
          # The budget file too: the hook's counts are otherwise only in the Step Summary.
          path: |
            questions/${{ steps.prep.outputs.slug }}
            ${{ runner.temp }}/search-budget.json

      # A dry-run forecast is never committed: the next real sweep would reuse the
      # logged-but-unsent folder and submit it without a fresh forecast.
      - name: Commit and push the record
        if: always() && steps.guard.outcome == 'success' && !inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.prep.outputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ./scripts/ci_commit.sh "sweep: ${TOURNAMENT} ${SLUG}"

  # One bot-health comment per exhaustion, keyed on its reset time, instead of one per
  # sweep: while the allowance is out the gate starts nothing, so no forecast job fails
  # to say so. (Round 2 left 26 identical failure comments on one issue.)
  report-exhaustion:
    needs: gate
    if: needs.gate.outputs.exhausted_until != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment once per exhaustion on the bot-health issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REASON: ${{ needs.gate.outputs.reason }}
          UNTIL: ${{ needs.gate.outputs.exhausted_until }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- allowance-exhausted ${UNTIL} -->"
          body="$(date -u +%FT%TZ) Claude allowance exhausted (${REASON}): the sweep starts no session until ${UNTIL}. Gate run: ${RUN_URL}

          ${marker}"
          gh label create bot-health --color B60205 --description "The forecasting bot is failing" 2>/dev/null || true
          num="$(gh issue list --label bot-health --state open --json number -q '.[0].number')"
          if [ -z "$num" ]; then
            gh issue create --label bot-health --title "bot: Claude allowance exhausted" --body "$body"
          elif gh issue view "$num" --json body,comments -q '.body, .comments[].body' | grep -qF "$marker"; then
            echo "Already reported on #$num: allowance exhausted until ${UNTIL}"
          else
            gh issue comment "$num" --body "$body"
          fi

  report-failure:
    needs: [gate, forecast]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the bot-health issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$(date -u +%FT%TZ) tournament-sweep failed: $RUN_URL"
          gh label create bot-health --color B60205 --description "The forecasting bot is failing" 2>/dev/null || true
          num="$(gh issue list --label bot-health --state open --json number -q '.[0].number')"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --label bot-health --title "bot: sweep failing" --body "$body"
          fi
