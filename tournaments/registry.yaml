# Tournaments the bot competes in. Read by scripts/tournament_registry.py; every
# field is written by that script, not by hand — `uv run scripts/tournament_registry.py
# --help`. See docs/bot-migration-plan.md §7.3.
#
# priority  lower number wins when a run's forecast budget cannot cover every open
#           question: the sweep takes them in (priority, soonest closes) order, so a
#           scored tournament is always forecast before a smoke-test one.
# mode      one_shot  — bot tournaments: one forecast per question, inside its window,
#                       never revisited.
#           updatable — normal tripwire/update loop (e.g. the Metaculus Cup).
# scored    whether results affect a public ranking. False means it is safe to
#           experiment in.
# active    false parks a tournament without losing its history. MiniBench is
#           registered but parked until the soak on bot-testing-area passes
#           (step P9.2); step P9.3 activates it.
#
# Only the comment block above survives a write by the script — per-entry comments
# do not, so notes belong here.
tournaments:
  - slug: "bot-testing-area"
    url: "https://www.metaculus.com/tournament/bot-testing-area/"
    name: "Bot Testing Area"
    added: "2026-09-14"
    active: true
    mode: "one_shot"
    scored: false
