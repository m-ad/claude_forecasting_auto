[project]
name = "claude-forecasting"
version = "0.1.0"
description = "Superforecasting workbench for Claude Code: per-question research folders, a scoreable forecast ledger, and Metaculus aggregation tooling."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "playwright>=1.44",   # required by the metaculus-aggregations skill
    "matplotlib>=3.8",    # calibration plots (optional at runtime)
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Pinned: ruff changes its default rule set between releases, and an
    # unpinned upgrade can turn CI red on code nobody touched.
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.pyright]
# `scripts/` is a flat directory of executables, not a package: the scripts add
# their own directory to sys.path and import each other by bare name, and the
# tests do the same via tests/conftest.py. Say so, or every such import is a
# red squiggle in the editor.
include = ["scripts", "tests"]
extraPaths = ["scripts", "tests"]

[tool.ruff]
# Question folders hold one-off helper scripts (charts, scenario models) that are
# part of a forecast's evidence trail, not maintained tooling.
extend-exclude = ["questions"]
# Honour the exclusion even when an editor or hook passes file paths explicitly.
force-exclude = true

[tool.ruff.lint]
ignore = [
    # This workbench reasons in the operator's local calendar date on purpose:
    # slug prefixes, `next_review`, `dates.closes` and `days_until` are all
    # calendar-day quantities, not instants, so `date.today()` is the right call
    # and `datetime.now(tz=...).date()` would only add a spurious timezone.
    # Ledger timestamps are a different thing and *are* tz-aware UTC
    # (`datetime.now(UTC)`), which the rest of the DTZ rules still check.
    "DTZ011",
]
