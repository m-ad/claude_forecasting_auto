[project]
name = "claude-forecasting"
version = "0.1.0"
description = "Superforecasting workbench for Claude Code: per-question research folders, a scoreable forecast ledger, and Metaculus aggregation tooling."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "playwright>=1.44",   # required by the metaculus-aggregations skill
    "matplotlib>=3.8",    # calibration plots (optional at runtime)
]

[tool.uv]
package = false
